[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = strict

markers =
    postgres: Integration tests requiring PostgreSQL with pgvector extension
    docker: Smoke tests requiring running Docker container stack

filterwarnings =
    ignore::FutureWarning
    ignore::DeprecationWarning
    ignore::UserWarning
